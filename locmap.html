<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="Maps of Jewish settlement in the Bohemian lands, 1857–1930" />
	<title>Kehillot | קהילות</title>

	<!-- vendor -->
	<script src="https://code.jquery.com/jquery-3.4.1.min.js"
		integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
		integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
		crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
		integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
		crossorigin=""></script>
	<script src="https://unpkg.com/osmtogeojson@2.2.12/osmtogeojson.js"></script>

	<!-- local -->
	<link href="styles.css" rel="stylesheet" type="text/css" />
	<script src="locmap.js" defer></script>
</head>

<body>
	<header class="head_foot">
		<div class="head_foot_block left head_foot_side">
			<p><a id="link_index">⬅<br /><span trans="link_index"></span></a></p>
		</div>
		<div class="head_foot_block center">
			<h1 id="loc_name"></h1>
		</div>
		<div class="head_foot_block right head_foot_side">
			<img class="flag" src="vendor/flags/cs.svg" alt="cs" role="button" tabindex="0" />
			<img class="flag" src="vendor/flags/en.svg" alt="en" role="button" tabindex="0" />
			<img class="flag" src="vendor/flags/de.svg" alt="de" role="button" tabindex="0" />
		</div>
	</header>
	<div class="content-wrap content-wrap-map">
		<div class="locmap-sidebar">
			<div class="tab-popis tab-popis-first">
				<h2 trans="loc_box1_head"></h2>
				<div style="text-align: center">
					<div id="timeline" class="selection"></div>
					<div id="info_census"></div>
					<div id="view_mod" class="selection"></div>
				</div>
			</div>
			<div class="tab-popis">
				<h2 trans="loc_box2_head"></h2>
				<div id="loc_box2_cont"></div>
			</div>
			<div class="tab-popis tab-popis-grow">
				<h2 trans="loc_box3_head"></h2>
				<div id="loc_box3_cont"><span trans="loc_box3_select"></span></div>
			</div>
			<div class="tab-popis tab-popis-download">
				<h2>Dataset</h2>
				<div id="download"></div>
			</div>

		</div>
		<div class="locmap-main">
			<div id="map" class="map-loading-wrap">
				<div id="wait" class="map-loading-spinner">
					<img src="vendor/images/loading.gif" width="40px" />
				</div>
			</div>
		</div>
	</div>

	<footer class="head_foot">
		<div class="head_foot_block left head_foot_footer">
			<a id="link_hiu_inst" target="_blank">
				<div class="footer-logo-block">
					<img src="vendor/logos/hiu.svg" class="logo" />
					<span trans="link_hiu_inst" class="logo-label"></span>
				</div>
			</a>
		</div>
		<div class="head_foot_block center">
			<p>
				<a id="link_hiu_db" target="_blank"><span trans="link_hiu_db"></span></a><br />
				<span>
					<a href="mailto:baranek@hiu.cas.cz" title="e-mail">
						<img src="vendor/images/email.svg" class="icon" />
					</a>
					<a href="https://scholia.toolforge.org/author/Q61685639" title="Wikidata/Scholia" target="_blank">
						<img src="vendor/logos/wikidata.svg" class="icon" />
					</a>
					<a id="link_mastodon" title="Mastodon" target="_blank">
						<img src="vendor/logos/mastodon.svg" class="icon" />
					</a>
				</span>
			</p>
		</div>
		<div class="head_foot_block right head_foot_footer">
			<a id="link_cc" target="_blank">
				<div class="footer-logo-block footer-logo-right">
					<img src="vendor/logos/cc-by-sa.svg" class="logo" />
				</div>
			</a>
			<a href="https://github.com/daelba/kehillot" target="_blank"
				title="GitHub repository">
				<div class="footer-logo-block">
					<img src="vendor/logos/github-mark-white.svg" class="logo" />
					<span class="logo-label"><span trans="verze"></span><br />1.0.1</span>
				</div>
			</a>
		</div>
	</footer>
</body>

</html>
